services:
  - type: web
    name: omnipulse-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT core.asgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: omnipulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: omnipulse-redis
          property: connectionString

  - type: redis
    name: omnipulse-redis
    plan: free
    ipAllowList: []

databases:
  - name: omnipulse-db
    plan: free